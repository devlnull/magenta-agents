name: ci
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for the tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Validate the source
        run: python magenta.py validate
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: The committed plugin is current
        run: python magenta.py check
      - name: Build all targets
        run: python magenta.py build
      - name: Install into a temporary home (all targets)
        shell: bash
        run: |
          HOME_DIR="$RUNNER_TEMP/home"
          python magenta.py install --home "$HOME_DIR"
          python magenta.py install --home "$HOME_DIR" --target opencode
          python magenta.py install --home "$HOME_DIR" --target codex
          python magenta.py install --home "$HOME_DIR" --target gemini
          test -f "$HOME_DIR/.claude/skills/magenta/SKILL.md"
          test -f "$HOME_DIR/.gemini/commands/magenta.toml"
          test -f "$HOME_DIR/.claude/agents/magenta-principal.md"
          test -f "$HOME_DIR/.claude/skills/magenta/scripts/verify.py"
          REPO_DIR="$RUNNER_TEMP/demo-repo"
          git init -q "$REPO_DIR"
          python magenta.py init "$REPO_DIR" --home "$HOME_DIR"
          test -f "$REPO_DIR/.claude/settings.local.json"
          python "$HOME_DIR/.claude/skills/magenta/scripts/verify.py" --repo "$REPO_DIR" status
          python magenta.py uninstall --home "$HOME_DIR"
          if grep -q "verify.py" "$REPO_DIR/.claude/settings.local.json"; then echo "the hooks were not removed"; exit 1; fi

  installer:
    name: installer on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install.sh from this commit
        if: runner.os != 'Windows'
        run: |
          git branch -f ci-install HEAD
          HOME="$RUNNER_TEMP/home" MAGENTA_REPO="$GITHUB_WORKSPACE" MAGENTA_REF=ci-install sh install.sh
          test -f "$RUNNER_TEMP/home/.claude/agents/magenta-qa.md"
          # The hook command sits in a YAML double-quoted string, so its quotes are escaped: \"
          grep -qF 'guard.py\" qa' "$RUNNER_TEMP/home/.claude/agents/magenta-qa.md"
          test -f "$RUNNER_TEMP/home/.claude/skills/magenta/scripts/verify.py"
      - name: install.ps1 from this commit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git branch -f ci-install HEAD
          $env:MAGENTA_REPO = $env:GITHUB_WORKSPACE
          $env:MAGENTA_REF = "ci-install"
          $env:MAGENTA_HOME = Join-Path $env:RUNNER_TEMP "magenta-src"
          ./install.ps1
          if (-not (Test-Path (Join-Path $HOME ".claude/agents/magenta-qa.md"))) { throw "agent not installed" }
