<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Magenta Agents: role-based AI agents for Claude Code. Done means the checks pass." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1220"/>
      <stop offset="1" stop-color="#2a0f22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#e91e63" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e91e63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8bbd0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 90H1280M0 180H1280M0 270H1280"/>
    <path d="M160 0V360M320 0V360M480 0V360M640 0V360M800 0V360M960 0V360M1120 0V360"/>
  </g>

  <!-- the team: eleven roles around one verified result -->
  <g transform="translate(1050 180)">
    <g stroke="#f06292" stroke-opacity="0.45" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="0" x2="65" y2="-101"/><line x1="0" y1="0" x2="109" y2="-50"/>
      <line x1="0" y1="0" x2="119" y2="17"/><line x1="0" y1="0" x2="91" y2="78"/><line x1="0" y1="0" x2="34" y2="115"/>
      <line x1="0" y1="0" x2="-34" y2="115"/><line x1="0" y1="0" x2="-91" y2="78"/><line x1="0" y1="0" x2="-119" y2="17"/>
      <line x1="0" y1="0" x2="-109" y2="-50"/><line x1="0" y1="0" x2="-65" y2="-101"/>
    </g>
    <circle r="120" fill="none" stroke="#f06292" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 8"/>
    <g fill="#2a1a2e" stroke="#f06292" stroke-width="3">
      <circle cx="0" cy="-120" r="13"/><circle cx="65" cy="-101" r="13"/><circle cx="109" cy="-50" r="13"/>
      <circle cx="119" cy="17" r="13"/><circle cx="91" cy="78" r="13"/><circle cx="34" cy="115" r="13"/>
      <circle cx="-34" cy="115" r="13"/><circle cx="-91" cy="78" r="13"/><circle cx="-119" cy="17" r="13"/>
      <circle cx="-109" cy="-50" r="13"/><circle cx="-65" cy="-101" r="13"/>
    </g>
    <circle r="52" fill="#c2185b"/>
    <circle r="52" fill="none" stroke="#f8bbd0" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M-22 1 L-6 17 L24 -15" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="76" font-weight="800" fill="url(#word)" letter-spacing="-1.5">Magenta Agents</text>
    <text x="82" y="205" font-size="27" fill="#e7dcea">A team of AI agents for Claude Code.</text>
    <text x="82" y="243" font-size="27" fill="#e7dcea">Done means <tspan fill="#f48fb1" font-weight="700">the checks pass</tspan>.</text>
    <g font-size="17" fill="#ffffff">
      <rect x="82" y="276" width="208" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#f06292" stroke-opacity="0.5"/>
      <text x="186" y="301" text-anchor="middle">11 engineering roles</text>
      <rect x="302" y="276" width="208" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#f06292" stroke-opacity="0.5"/>
      <text x="406" y="301" text-anchor="middle">Checks you approve</text>
      <rect x="522" y="276" width="208" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#f06292" stroke-opacity="0.5"/>
      <text x="626" y="301" text-anchor="middle">Benchmarked releases</text>
    </g>
  </g>
</svg>
