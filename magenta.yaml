# Team configuration (RFC-0001).

version: 1

# The release version. The release workflow checks that the tag agrees with it.
release: 0.10.0

# Owner of the plugin marketplace.
owner: AMQ

# The GitHub repository that serves the plugin marketplace and the installers.
repository: https://github.com/devlnull/magenta-agents

# Agents that the build generates.
agents_enabled: [principal, product-manager, architect, qa, engineer, frontend, sre, platform, security, database, writer]

# Agents that the docs already name, but that do not exist yet. The roster shows them as not available.
agents_planned: []

# Name prefix for generated agents and skills, to avoid collisions with other agents.
prefix: magenta-

# Default turn limit for each agent run (interactive budget, RFC-0001 8.2).
default_max_turns: 60

lanes:
  lite:
    gates: [checks, done]
  standard:
    gates: [prd-go, scope-and-design, merge]
  full:
    gates: [prd-go, scope-and-design, merge, release]
